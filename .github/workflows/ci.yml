name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  check:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Core tests
        # Coverage thresholds are set to 100% in packages/core/vitest.config.ts,
        # so a drop in coverage fails this step rather than merely reporting it.
        run: npm run test:core
      - name: Web tests
        run: npm run test:web
      - name: Mutation smoke test
        # Applies representative mutations to the core and fails if the suite would
        # not have noticed any of them. See stryker.config.json for why the full
        # Stryker run is not here.
        run: npm run mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: packages/core/coverage
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: apps/web/dist
          retention-days: 7

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run e2e
        env:
          E2E_CROSS_BROWSER: '1'
      - name: Subpath hosting
        run: npm run e2e -w @80in8/web -- e2e/hosting.spec.ts
        env:
          BASE_PATH: /80in8/
          E2E_CROSS_BROWSER: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
