name: Mutation testing

# Coverage only proves a line ran. Mutation testing proves the tests would notice if it
# changed, which is the property the core library actually needs.
#
# The full Stryker run is blocked: it does not work against TypeScript 7 and Vitest 5,
# and reports wrong numbers rather than failing loudly. See stryker.config.json for the
# detail and the evidence. Until that is fixed, `npm run mutation` runs a hand-written
# set of representative mutations, which is narrower but honest, and fast enough to
# belong in the ordinary CI job. This workflow exists to re-test Stryker on demand.
on:
  workflow_dispatch:

jobs:
  stryker:
    name: Stryker on the core (known broken)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx stryker run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 30
